<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 소극장 시맨틱 아카이브 1970s–</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mirador@3.3.0/dist/mirador.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif KR', 'Georgia', serif;
    background: #fff;
    color: #111;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 상단 헤더 */
  header {
    border-bottom: 2px solid #111;
    padding: 14px 28px;
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-shrink: 0;
    position: relative;
    z-index: 1200;
  }
  header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #111;
  }
  header span {
    font-size: 0.75rem;
    color: #888;
    letter-spacing: 0.05em;
  }

  /* 탭 */
  nav {
    border-bottom: 1px solid #ddd;
    display: flex;
    flex-shrink: 0;
    position: relative;
    z-index: 1200;
  }
  nav button {
    padding: 12px 28px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    background: none;
    cursor: pointer;
    color: #555;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s;
    font-family: inherit;
  }
  nav button.active {
    color: #111;
    border-bottom: 2px solid #111;
  }
  nav button:hover { color: #111; }

  /* 메인 컨텐츠 */
  .tab-content { display: none; flex: 1; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* 탭1 레이아웃 */
  #tab1 { flex-direction: row; }

  #map {
    flex: 0 1 70%;
    border-right: 1px solid #ddd;
  }

  /* 오른쪽 패널 */
  #sidebar {
    flex: 1 1 30%;
    overflow-y: auto;
    padding: 0;
  }

  .sidebar-header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid #eee;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
  }

  .venue-item {
    border-bottom: 1px solid #eee;
    padding: 20px 24px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .venue-item:hover { background: #f8f8f8; }
  .venue-item.highlighted { background: #f0f0f0; }

  .venue-name {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .venue-address {
    font-size: 0.88rem;
    color: #888;
    margin-bottom: 10px;
    font-family: 'Arial', sans-serif;
  }

  .perf-list {
    display: none;
    margin-top: 10px;
  }
  .perf-list.open { display: block; }

  .perf-item {
    font-size: 0.95rem;
    padding: 5px 0 5px 12px;
    border-left: 1px solid #ccc;
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .perf-item a {
    color: #111;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .perf-item a:hover { color: #555; }
  .perf-item span { color: #555; }

  .perf-count {
    font-size: 0.82rem;
    color: #999;
    font-family: 'Arial', sans-serif;
  }

  .toggle-btn {
    font-size: 0.8rem;
    color: #777;
    background: none;
    border: 1px solid #ddd;
    padding: 3px 10px;
    cursor: pointer;
    margin-top: 5px;
    letter-spacing: 0.05em;
    font-family: inherit;
  }
  .toggle-btn:hover { background: #f0f0f0; }

  .net-btn {
    font-size: 0.72rem;
    color: #b85042;
    background: none;
    border: 1px solid #b85042;
    border-radius: 3px;
    padding: 1px 6px;
    cursor: pointer;
    letter-spacing: 0.03em;
    font-family: inherit;
    vertical-align: middle;
  }
  .net-btn:hover { background: #b85042; color: #fff; }

  /* 드래그 안내 */
  .drag-tip {
    font-size: 0.68rem;
    color: #bbb;
    padding: 10px 20px;
    border-bottom: 1px solid #eee;
    font-family: 'Arial', sans-serif;
  }

  /* 탭3 Mirador */
  #tab3 { flex-direction: column; overflow: hidden; }
  #mirador-container { flex: 1; width: 100%; min-height: 0; position: relative; overflow: hidden; }
  #mirador-nav {
    flex-shrink: 0; padding: 8px 16px; border-bottom: 1px solid #ddd;
    display: flex; gap: 8px; background: #fff;
  }
  #mirador-nav button {
    font-size: 0.78rem; padding: 4px 14px; border: 1px solid #bbb;
    background: none; cursor: pointer; font-family: inherit; color: #555;
    letter-spacing: 0.04em;
  }
  #mirador-nav button:hover { background: #f0f0f0; color: #111; }

  /* Leaflet 커스텀 마커 */
  .custom-marker {
    width: 20px;
    height: 20px;
    background: #111;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    cursor: grab;
  }
  .custom-marker:active { cursor: grabbing; }

  /* 랜드마크 텍스트 라벨 (극장 마커와 구분되는 참고 지점) */
  .landmark-label {
    font-family: 'Noto Serif KR', serif;
    font-size: 0.72rem;
    font-style: italic;
    color: #b85042;
    white-space: nowrap;
    text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff, 0 -1px 0 #fff;
    cursor: pointer;
    pointer-events: auto;
  }

  /* 팝업 스타일 */
  .leaflet-popup-content-wrapper {
    border-radius: 0;
    border: 1px solid #111;
    box-shadow: none;
    font-family: 'Noto Serif KR', serif;
  }
  .leaflet-popup-tip { background: #111; }
  .leaflet-popup-content { margin: 10px 14px; }
  .popup-name { font-size: 0.85rem; font-weight: 700; }
  .popup-addr { font-size: 0.72rem; color: #888; margin-top: 4px; }

  /* ===== TAB2 NETWORK ===== */
  #tab2 { flex-direction: row; overflow: hidden; flex: 1; min-height: 0; }
  #network-sidebar {
    width: 260px; flex-shrink: 0; border-right: 1px solid #ddd;
    display: flex; flex-direction: column; overflow: hidden; background: #fff; height: 100%;
  }
  #ns-header { flex-shrink: 0; border-bottom: 1px solid #eee; }
  #ns-search-wrap {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-bottom: 1px solid #eee; box-sizing: border-box; width: 100%;
  }
  #ns-search {
    flex: 1; min-width: 0; border: 1px solid #ddd; padding: 5px 8px;
    font-size: 0.73rem; font-family: inherit; outline: none; box-sizing: border-box;
  }
  #ns-search:focus { border-color: #111; }
  #ns-reset-btn {
    font-size: 0.66rem; padding: 5px 7px; border: 1px solid #ddd;
    background: none; cursor: pointer; font-family: inherit; white-space: nowrap;
    flex-shrink: 0; color: #666;
  }
  #ns-reset-btn:hover { background: #f0f0f0; }
  #ns-path-wrap {
    display: flex; flex-direction: column; gap: 5px; padding: 8px 10px;
    border-bottom: 1px solid #eee; box-sizing: border-box;
  }
  #ns-path-from, #ns-path-to {
    border: 1px solid #ddd; padding: 5px 8px; font-size: 0.73rem;
    font-family: inherit; outline: none; box-sizing: border-box; width: 100%;
  }
  #ns-path-from:focus, #ns-path-to:focus { border-color: #111; }
  #ns-path-btn {
    font-size: 0.7rem; padding: 5px 0; border: 1px solid #111;
    background: #111; color: #fff; cursor: pointer; font-family: inherit;
  }
  #ns-path-btn:hover { background: #333; }
  #ns-path-msg { font-size: 0.68rem; color: #b85042; padding: 0 10px; min-height: 1.2em; }
  #ns-tabs { display: flex; flex-wrap: wrap; padding: 6px 8px 0; gap: 4px; }
  .ns-tab {
    font-size: 0.65rem; padding: 3px 8px; border: 1px solid #ddd;
    background: none; cursor: pointer; font-family: inherit; color: #888;
    border-radius: 2px; margin-bottom: 6px;
  }
  .ns-tab.active { color: #fff; border-color: transparent; }
  #ns-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .ns-node-item {
    padding: 7px 14px; cursor: pointer; border-left: 3px solid transparent;
    transition: background 0.1s; line-height: 1.5; color: #111;
  }
  .ns-node-item:hover { background: #f5f5f5; }
  .ns-node-item.active { background: #f0f0f0; }
  .ns-node-main { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  .ns-node-idx { font-size: 0.68rem; color: #bbb; flex-shrink: 0; min-width: 22px; font-family: 'Arial', sans-serif; }
  .ns-node-title { font-weight: 600; color: #111; font-size: 0.84rem; }
  .ns-node-item.active .ns-node-title { font-weight: 700; }
  .ns-node-meta { font-size: 0.68rem; color: #888; font-family: 'Arial', sans-serif; flex-shrink: 0; }
  .ns-node-url { padding: 2px 0 2px 27px; }
  .ns-node-url a { font-size: 0.65rem; color: #aaa; word-break: break-all; text-decoration: none; }
  .ns-node-url a:hover { color: #555; text-decoration: underline; }
  #network-main { flex: 1; position: relative; overflow: hidden; background: #fafafa; height: 100%; }
  #net-filter-bar {
    width: 260px; flex-shrink: 0; border-left: 1px solid #ddd;
    background: #fff; padding: 12px; display: none; flex-direction: column; gap: 14px;
    overflow-y: auto; height: 100%; box-sizing: border-box;
  }
  #net-filter-bar.visible { display: flex; }
  #net-filter-relations, #net-filter-classes { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex-wrap: wrap; }
  .filter-label { font-size: 0.65rem; color: #999; letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0; min-width: 28px; }
  .rel-checkbox-item { display: flex; align-items: center; gap: 3px; font-size: 0.68rem; color: #555; cursor: pointer; white-space: nowrap; }
  .rel-checkbox-item input { cursor: pointer; margin: 0; width: 11px; height: 11px; }
  .class-toggle-btn {
    font-size: 0.65rem; padding: 2px 8px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; border-radius: 2px; color: #666;
    font-family: inherit; transition: all 0.1s;
  }
  .class-toggle-btn.active { color: #fff; border-color: transparent; }
  #network-empty {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: #bbb; font-size: 0.85rem; line-height: 1.8;
    letter-spacing: 0.04em; pointer-events: none; z-index: 1;
  }
  #network-svg {
    width: 100%; height: 100%; display: block;
    position: absolute; top: 0; left: 0; cursor: default; user-select: none; z-index: 2;
  }
  #network-legend {
    position: absolute; top: 12px; right: 12px; z-index: 21;
    background: rgba(255,255,255,0.95); border: 1px solid #ddd;
    padding: 8px 12px; font-size: 0.68rem; line-height: 1.8; display: none;
  }
  #network-legend.visible { display: block; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #network-tooltip {
    position: absolute; background: #111; color: #fff; font-size: 0.72rem;
    padding: 5px 10px; pointer-events: none; display: none; z-index: 30;
    max-width: 220px; line-height: 1.4;
  }
  .net-link { stroke: #bbb; stroke-width: 1.5; }
  .net-link.highlighted { stroke: #555; stroke-width: 2.5; }
  .net-node circle { cursor: pointer; }
  .net-node text { pointer-events: none; font-family: 'Noto Serif KR', serif; }
  .net-node.dimmed circle { opacity: 0.2; }
  .net-node.dimmed text { opacity: 0.2; }
  .net-link-label { font-size: 8px; fill: #aaa; pointer-events: none; text-anchor: middle; dominant-baseline: middle; font-family: Arial, sans-serif; }

  /* 팝업 모드: 헤더/네비/노드 목록 숨기고 그래프 영역만 표시 */
  body.popup-mode header,
  body.popup-mode nav,
  body.popup-mode #network-sidebar { display: none !important; }
  body.popup-mode #network-main { flex: 1 1 100%; }

</style>
</head>
<body>

<header>
  <h1>한국 소극장 시맨틱 아카이브</h1>
  <span>1970s–1980s · Seoul</span>
</header>

<nav>
  <button class="active" onclick="showTab(1)">지도</button>
  <button onclick="showTab(2)">시맨틱 네트워크</button>
  <button onclick="showTab(3)">연구자료</button>
</nav>

<div id="tab1" class="tab-content active">
  <div id="map"></div>
  <div id="sidebar">
    <div class="sidebar-header">극장 목록 · <span id="venue-count"></span></div>
    <div class="drag-tip">※ 지도 위 마커를 드래그하여 위치 수정 가능</div>
    <div id="venue-list"></div>
  </div>
</div>

<div id="tab2" class="tab-content">
  <div id="network-sidebar">
    <div id="ns-header">
      <div id="ns-search-wrap">
        <input id="ns-search" type="text" placeholder="노드 검색..." autocomplete="off"/>
        <button id="ns-reset-btn">↺ 초기화</button>
      </div>
      <div id="ns-path-wrap">
        <input id="ns-path-from" type="text" placeholder="출발 노드..." autocomplete="off"/>
        <input id="ns-path-to" type="text" placeholder="도착 노드..." autocomplete="off"/>
        <button id="ns-path-btn">경로 찾기</button>
      </div>
      <div id="ns-path-msg"></div>
      <div id="ns-tabs"></div>
    </div>
    <div id="ns-list"></div>
  </div>
  <div id="network-main">
    <div id="network-empty">
      <span>왼편의 노드를 클릭하시면<br>네트워크 그래프가 구현됩니다.</span>
      <div style="font-size:0.65rem;color:#ccc;margin-top:12px;line-height:1.8;">휠: 줌 &nbsp;|&nbsp; 배경 드래그: 이동 &nbsp;|&nbsp; 노드 드래그: 위치 조정</div>
    </div>
    <div id="network-legend"></div>
    <div id="network-tooltip"></div>
    <svg id="network-svg"></svg>
  </div>
  <div id="net-filter-bar">
    <div id="net-filter-relations">
      <span class="filter-label">관계</span>
      <div id="rel-checkboxes"></div>
    </div>
    <div id="net-filter-classes">
      <span class="filter-label">클래스</span>
      <div id="class-toggles"></div>
    </div>
  </div>
</div>

<div id="tab3" class="tab-content">
  <div id="mirador-nav">
    <button onclick="showTab(1)">← 지도</button>
    <button onclick="showTab(2)">시맨틱 네트워크</button>
  </div>
  <div id="mirador-container"></div>
</div>

let ALL_NODES = [];
let ALL_LINKS = [];

async function loadNetworkData() {
  const [nodesRes, linksRes] = await Promise.all([
    fetch('network_nodes.json'),
    fetch('network_links.json')
  ]);
  ALL_NODES = await nodesRes.json();
  ALL_LINKS = await linksRes.json();
  nodeById = {};
  ALL_NODES.forEach(n => nodeById[n.id] = n);
  adjacency = {};
  ALL_LINKS.forEach(l => {
    if (!adjacency[l.source]) adjacency[l.source] = [];
    if (!adjacency[l.target]) adjacency[l.target] = [];
    adjacency[l.source].push({ neighbor: l.target, relation: l.relation });
    adjacency[l.target].push({ neighbor: l.source, relation: l.relation });
  });
}

// ── Dedup links ──
function dedupeLinks(links) {
  const seen = new Set();
  return links.filter(l => {
    const key = l.source + '|' + l.target + '|' + l.relation;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
}

// ── 경로 찾기 ──
function findNodeByTitle(text) {
  const q = (text || '').trim().toLowerCase();
  if (!q) return null;
  return ALL_NODES.find(n => n.title && n.title.toLowerCase().includes(q)) || null;
}

function bfsPath(startId, endId) {
  if (startId === endId) return [startId];
  const visited = new Set([startId]);
  const queue = [[startId]];
  while (queue.length) {
    const path = queue.shift();
    const last = path[path.length - 1];
    const neighbors = adjacency[last] || [];
    for (const nb of neighbors) {
      if (nb.neighbor === endId) return [...path, endId];
      if (!visited.has(nb.neighbor)) {
        visited.add(nb.neighbor);
        queue.push([...path, nb.neighbor]);
      }
    }
  }
  return null;
}

function renderPath(pathIds) {
  const graphNodes = pathIds.map(id => nodeById[id]).filter(Boolean);
  const graphLinks = [];
  for (let i = 0; i < pathIds.length - 1; i++) {
    const a = pathIds[i], b = pathIds[i + 1];
    graphLinks.push(...ALL_LINKS.filter(l =>
      (l.source === a && l.target === b) || (l.source === b && l.target === a)
    ));
  }
  const dedupedLinks = dedupeLinks(graphLinks);
  currentGraphNodes = graphNodes; currentGraphLinks = dedupedLinks; currentCenterNodeId = pathIds[0];
  buildRelationFilter(dedupedLinks); buildClassFilter(graphNodes);
  document.getElementById('network-empty').style.display = 'none';
  document.getElementById('network-legend').classList.add('visible');
  document.getElementById('net-filter-bar').classList.add('visible');
  const { nodes, links } = getFilteredData();
  drawGraph(nodes, links, pathIds[0]);
}

  if (!fromNode || !toNode) { msgEl.textContent = '노드를 찾을 수 없습니다.'; return; }
  if (fromNode.id === toNode.id) { msgEl.textContent = '같은 노드입니다.'; return; }
  const path = bfsPath(fromNode.id, toNode.id);
  if (!path) { msgEl.textContent = '두 노드 사이에 연결된 경로가 없습니다.'; return; }
  activeNodeId = null; searchQuery = '';
  renderPath(path);

// ── Filters ──
function getFilteredData() {
  const nodes = activeClasses.size === 0
    ? currentGraphNodes
    : currentGraphNodes.filter(n => activeClasses.has(n.class));
  const nodeIds = new Set(nodes.map(n => n.id));
  const links = currentGraphLinks.filter(l =>
    nodeIds.has(l.source) && nodeIds.has(l.target) &&
    (activeRelations.size === 0 || activeRelations.has(l.relation))
  );
  return { nodes, links };
}

function applyFilters() {
  if (!currentCenterNodeId) return;
  const { nodes, links } = getFilteredData();
  drawGraph(nodes, links, currentCenterNodeId);
}

function buildRelationFilter(links) {
  const rels = [...new Set(links.map(l => l.relation).filter(r => r && r !== 'nan' && r !== ''))].sort();
  activeRelations = new Set();
  const container = document.getElementById('rel-checkboxes');
  container.innerHTML = '';
  const allItem = document.createElement('label');
  allItem.className = 'rel-checkbox-item';
  const allCb = document.createElement('input');
  allCb.type = 'checkbox'; allCb.checked = true; allCb.id = 'rel-all';
  allCb.addEventListener('change', () => {
    if (allCb.checked) {
      activeRelations = new Set();
      container.querySelectorAll('input[data-rel]').forEach(cb => cb.checked = true);
    }
    applyFilters();
  });
  allItem.appendChild(allCb); allItem.appendChild(document.createTextNode('전체'));
  container.appendChild(allItem);
  rels.forEach(rel => {
    const item = document.createElement('label');
    item.className = 'rel-checkbox-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.dataset.rel = rel;
    cb.addEventListener('change', () => {
      if (cb.checked) activeRelations.delete(rel);
      else { activeRelations.add(rel); document.getElementById('rel-all').checked = false; }
      const allChecked = [...container.querySelectorAll('input[data-rel]')].every(c => c.checked);
      if (allChecked) { activeRelations = new Set(); document.getElementById('rel-all').checked = true; }
      applyFilters();
    });
    item.appendChild(cb); item.appendChild(document.createTextNode(rel));
    container.appendChild(item);
  });
}

function buildClassFilter(nodes) {
  const classes = [...new Set(nodes.map(n => n.class))];

    });

  });
  container.appendChild(allBtn);
  classes.forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'class-toggle-btn active';
    btn.textContent = CLASS_LABELS[cls]||cls;
    btn.style.cssText = `background:${CLASS_COLORS[cls]||'#999'};color:#fff;border-color:${CLASS_COLORS[cls]||'#999'};`;
    btn.dataset.cls = cls;
    btn.addEventListener('click', () => {
      if (activeClasses.has(cls)) {
        activeClasses.delete(cls); btn.classList.remove('active');
        btn.style.background='#fff'; btn.style.color=CLASS_COLORS[cls]||'#999'; btn.style.borderColor=CLASS_COLORS[cls]||'#999';
      } else {

        btn.style.background=CLASS_COLORS[cls]||'#999'; btn.style.color='#fff'; btn.style.borderColor=CLASS_COLORS[cls]||'#999';
      }

      if (activeClasses.size === 0) { ab.classList.add('active'); ab.style.cssText='background:#555;color:#fff;border-color:#555;'; }
      else { ab.classList.remove('active'); ab.style.cssText='background:#fff;color:#555;border-color:#ddd;'; }

// ── Render Graph ──
function renderGraph(centerNodeId) {
  const centerNode = nodeById[centerNodeId];
  if (!centerNode) return;
  document.getElementById('network-empty').style.display = 'none';
  document.getElementById('network-legend').classList.add('visible');
  document.getElementById('net-filter-bar').classList.add('visible');

  const neighbors = adjacency[centerNodeId] || [];
  const graphNodes = [centerNode];
  const seen = new Set([centerNodeId]);
  neighbors.forEach(n => {
    if (nodeById[n.neighbor] && !seen.has(n.neighbor)) {
      graphNodes.push(nodeById[n.neighbor]); seen.add(n.neighbor);
    }
  });
  const graphLinks = dedupeLinks(ALL_LINKS.filter(l =>
    (l.source === centerNodeId && seen.has(l.target)) ||
    (l.target === centerNodeId && seen.has(l.source))
  ));
  currentGraphNodes = graphNodes; currentGraphLinks = graphLinks; currentCenterNodeId = centerNodeId;
  buildRelationFilter(graphLinks); buildClassFilter(graphNodes);
  const { nodes, links } = getFilteredData();
  drawGraph(nodes, links, centerNodeId);
}

function expandGraph(nodeId) {
  simRunning = false;
  const svg = document.getElementById('network-svg');
  const existingIds = new Set(Array.from(svg.querySelectorAll('.net-node')).map(el => el.dataset.id));
  (adjacency[nodeId]||[]).forEach(n => existingIds.add(n.neighbor));
  existingIds.add(nodeId);
  const graphNodes = Array.from(existingIds).filter(id => nodeById[id]).map(id => nodeById[id]);
  const graphLinks = dedupeLinks(ALL_LINKS.filter(l => existingIds.has(l.source) && existingIds.has(l.target)));
  currentGraphNodes = graphNodes; currentGraphLinks = graphLinks; currentCenterNodeId = nodeId;
  buildRelationFilter(graphLinks); buildClassFilter(graphNodes);
  const { nodes, links } = getFilteredData();
  drawGraph(nodes, links, nodeId);
}

// ── Draw Graph ──
function drawGraph(graphNodes, graphLinks, centerNodeId) {
  simRunning = false;
  const svg = document.getElementById('network-svg');
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const rect = svg.parentElement.getBoundingClientRect();
  const W = Math.max(rect.width, 400);
  const H = Math.max(rect.height, 400);

  const ns = 'http://www.w3.org/2000/svg';

  // Defs
  const defs = document.createElementNS(ns, 'defs');
  const marker = document.createElementNS(ns, 'marker');
  marker.setAttribute('id','arr'); marker.setAttribute('markerWidth','8');
  marker.setAttribute('markerHeight','6'); marker.setAttribute('refX','22');
  marker.setAttribute('refY','3'); marker.setAttribute('orient','auto');
  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points','0 0,8 3,0 6'); poly.setAttribute('fill','#ccc');
  marker.appendChild(poly); defs.appendChild(marker); svg.appendChild(defs);

  // Root group for zoom/pan
  const root = document.createElementNS(ns, 'g');
  svg.appendChild(root);
  let tx=0, ty=0, tk=1;
  function applyT() { root.setAttribute('transform',`translate(${tx},${ty}) scale(${tk})`); }

  // Zoom
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const delta = e.deltaY<0?1.12:0.89;
    const nk = Math.max(0.15, Math.min(6, tk*delta));
    tx = mx-(mx-tx)*(nk/tk); ty = my-(my-ty)*(nk/tk); tk=nk; applyT();
  }, {passive:false});

  // Pan
  let panning=false, px=0, py=0;
  svg.addEventListener('mousedown', e => {
    if (e.target===svg||e.target===root) {
      panning=true; px=e.clientX-tx; py=e.clientY-ty; svg.style.cursor='grabbing';
    }
  });
  window.addEventListener('mousemove', e => {
    if (!panning) return; tx=e.clientX-px; ty=e.clientY-py; applyT();
  });
  window.addEventListener('mouseup', () => { panning=false; svg.style.cursor='default'; });

  // Groups
  const gLinks = document.createElementNS(ns,'g');
  const gLabels = document.createElementNS(ns,'g');
  const gNodes = document.createElementNS(ns,'g');
  root.appendChild(gLinks); root.appendChild(gLabels); root.appendChild(gNodes);

  // Node positions
  const pos = {};
  const others = graphNodes.filter(n=>n.id!==centerNodeId);
  pos[centerNodeId] = {x:W/2,y:H/2,vx:0,vy:0,pinned:false};
  others.forEach((n,i) => {
    const angle = (2*Math.PI*i)/Math.max(others.length,1);
    const r = Math.min(W,H)*0.3;
    pos[n.id] = {x:W/2+r*Math.cos(angle),y:H/2+r*Math.sin(angle),vx:0,vy:0,pinned:false};
  });

  // Build nodeMap for link mapping
  const nodeMap = {};
  graphNodes.forEach(n => nodeMap[n.id]=n);

  // Map links to node objects
  const mappedLinks = graphLinks.map(l => ({
    source: l.source, target: l.target, relation: l.relation, page: l.page, series: l.series
  })).filter(l => pos[l.source] && pos[l.target]);

  // 연결 횟수(degree)에 따른 노드 크기
  const degree = {};
  mappedLinks.forEach(l => {
    degree[l.source] = (degree[l.source]||0)+1;
    degree[l.target] = (degree[l.target]||0)+1;
  });
  const maxDegree = Math.max(1, ...graphNodes.map(n=>degree[n.id]||0));
  const MIN_R = 14, MAX_R = 32;
  function radiusFor(n) {
    const d = degree[n.id]||0;
    const rr = MIN_R + (MAX_R-MIN_R)*Math.sqrt(d/maxDegree);
    return n.id===centerNodeId ? rr+5 : rr;
  }

  // Draw lines
  const NODE_R = 22;
  const lineEls = mappedLinks.map(l => {
    const line = document.createElementNS(ns,'line');
    line.setAttribute('class','net-link');
    line.setAttribute('marker-end','url(#arr)');
    gLinks.appendChild(line);

    // 보이지 않는 넓은 히트 영역 (1.5px 선은 마우스로 정확히 잡기 어려움)
    const hitLine = document.createElementNS(ns,'line');
    hitLine.setAttribute('stroke','transparent');
    hitLine.setAttribute('stroke-width','14');
    hitLine.style.cursor = 'pointer';
    gLinks.appendChild(hitLine);

    // Hover tooltip: 관계 + 채록문 페이지/시리즈번호 (있는 경우만)
    hitLine.addEventListener('mouseenter', e => {
      const sr = svg.getBoundingClientRect();
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX-sr.left+14)+'px';
      tooltip.style.top=(e.clientY-sr.top-36)+'px';
      let txt = (l.relation && l.relation!=='nan' && l.relation!=='undefined') ? l.relation : '관계';
      if (l.series || l.page) {
        txt += ' · 채록문';
        if (l.series) txt += ' ' + l.series;
        if (l.page) txt += ' p.' + l.page;
      }
      tooltip.textContent = txt;
      line.classList.add('highlighted');
    });
    hitLine.addEventListener('mousemove', e => {
      const sr = svg.getBoundingClientRect();
      tooltip.style.left=(e.clientX-sr.left+14)+'px';
      tooltip.style.top=(e.clientY-sr.top-36)+'px';
    });
    hitLine.addEventListener('mouseleave', () => {
      tooltip.style.display='none';
      line.classList.remove('highlighted');
    });

    return {line, hitLine, l};
  });

  // Tooltip
  const tooltip = document.getElementById('network-tooltip');

  // Draw nodes
  const nodeEls = graphNodes.map(n => {
    const g = document.createElementNS(ns,'g');
    g.setAttribute('class','net-node'+(n.id===centerNodeId?' center':''));
    g.dataset.id = n.id; g.style.cursor='grab';

    const r = radiusFor(n);
    const circle = document.createElementNS(ns,'circle');
    circle.setAttribute('r', r);
    circle.setAttribute('fill', CLASS_COLORS[n.class]||'#ccc');
    circle.setAttribute('stroke','#fff');
    circle.setAttribute('stroke-width', n.id===centerNodeId?'3':'2');

    // Label: max 2 lines, fit inside circle
    const txt = document.createElementNS(ns,'text');
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('fill','#333');
    txt.setAttribute('font-size','9');
    txt.setAttribute('font-weight', n.id===centerNodeId?'700':'500');
    txt.style.pointerEvents='none';

    const title = n.title||n.id;
    const maxCh = Math.floor(r*1.3/5); // ~chars fitting in diameter
    if (title.length <= maxCh) {
      txt.setAttribute('dominant-baseline','middle');
      txt.textContent = title;
    } else {
      const line1 = title.slice(0, maxCh);
      const line2 = title.slice(maxCh, maxCh*2-1) + (title.length>maxCh*2-1?'…':'');
      const ts1 = document.createElementNS(ns,'tspan');
      ts1.textContent=line1; ts1.setAttribute('x','0'); ts1.setAttribute('dy','-0.5em');
      const ts2 = document.createElementNS(ns,'tspan');
      ts2.textContent=line2; ts2.setAttribute('x','0'); ts2.setAttribute('dy','1.2em');
      txt.appendChild(ts1); txt.appendChild(ts2);
    }

    g.appendChild(circle); g.appendChild(txt);

    if (n.class === 'foaf:Agent') {
      const gLabel = genreLabel(n.genre);
      if (gLabel) {
        const gtxt = document.createElementNS(ns,'text');
        gtxt.setAttribute('text-anchor','middle');
        gtxt.setAttribute('x','0');
        gtxt.setAttribute('y', r + 13);
        gtxt.setAttribute('fill','#888');
        gtxt.setAttribute('font-size','8');
        gtxt.style.pointerEvents='none';
        gtxt.textContent = gLabel;
        g.appendChild(gtxt);
      }
    }

    gNodes.appendChild(g);

    // Hover tooltip
    g.addEventListener('mouseenter', e => {
      const sr = svg.getBoundingClientRect();
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX-sr.left+14)+'px';
      tooltip.style.top=(e.clientY-sr.top-36)+'px';
      tooltip.textContent=(n.title||n.id)+' ['+( CLASS_LABELS[n.class]||n.class)+']';
    });
    g.addEventListener('mouseleave',()=>{tooltip.style.display='none';});

    // Single click: highlight
    let clickTimer=null;
    g.addEventListener('click', e => {
      e.stopPropagation();
      if(clickTimer){clearTimeout(clickTimer);clickTimer=null;return;}
      clickTimer=setTimeout(()=>{
        clickTimer=null;
        const connIds=new Set([n.id]);
        mappedLinks.forEach(l=>{
          if(l.source===n.id)connIds.add(l.target);
          if(l.target===n.id)connIds.add(l.source);
        });
        nodeEls.forEach(ne=>{
          ne.g.classList.toggle('dimmed',!connIds.has(ne.n.id));
        });
        lineEls.forEach(le=>{
          const conn=le.l.source===n.id||le.l.target===n.id;
          le.line.classList.toggle('highlighted',conn);
        });
      },220);
    });

    // Double click: expand
    g.addEventListener('dblclick', e=>{
      e.stopPropagation();
      if(clickTimer){clearTimeout(clickTimer);clickTimer=null;}
      activeNodeId=n.id; updateHash(n.id); expandGraph(n.id);
    });

    // Drag
    let dragging=false, dox=0, doy=0;
    g.addEventListener('mousedown', e=>{
      e.stopPropagation(); dragging=true;
      pos[n.id].pinned=true; g.style.cursor='grabbing';
      const sr=svg.getBoundingClientRect();
      dox=(e.clientX-sr.left-tx)/tk-pos[n.id].x;
      doy=(e.clientY-sr.top-ty)/tk-pos[n.id].y;
    });
    window.addEventListener('mousemove', e=>{
      if(!dragging)return;
      const sr=svg.getBoundingClientRect();
      pos[n.id].x=(e.clientX-sr.left-tx)/tk-dox;
      pos[n.id].y=(e.clientY-sr.top-ty)/tk-doy;
      pos[n.id].vx=0; pos[n.id].vy=0;
      updatePos();
    });
    window.addEventListener('mouseup',()=>{if(dragging){dragging=false;g.style.cursor='grab';}});

    return {g, n};
  });

  // Clear on bg click
  svg.addEventListener('click', e=>{
    if(e.target===svg||e.target===root){
      nodeEls.forEach(ne=>ne.g.classList.remove('dimmed'));
      lineEls.forEach(le=>le.line.classList.remove('highlighted'));
    }
  });

  // Update positions
  function updatePos() {
    nodeEls.forEach(ne=>{
      const p=pos[ne.n.id];
      ne.g.setAttribute('transform',`translate(${p.x},${p.y})`);
    });
    lineEls.forEach(le=>{
      const s=pos[le.l.source], t=pos[le.l.target];
      if(!s||!t)return;
      le.line.setAttribute('x1',s.x); le.line.setAttribute('y1',s.y);
      le.line.setAttribute('x2',t.x); le.line.setAttribute('y2',t.y);
      le.hitLine.setAttribute('x1',s.x); le.hitLine.setAttribute('y1',s.y);
      le.hitLine.setAttribute('x2',t.x); le.hitLine.setAttribute('y2',t.y);
    });
  }

  // Force simulation
  const REPEL=7000, SPRING=0.025, REST=150, DAMP=0.78, CPULL=0.006;
  simRunning=true;
  let frame=0; const MAX=500;

  function tick() {
    // Repulsion
    const ids=graphNodes.map(n=>n.id);
    for(let i=0;i<ids.length;i++) {
      for(let j=i+1;j<ids.length;j++) {
        const a=pos[ids[i]],b=pos[ids[j]];
        let dx=b.x-a.x||0.1, dy=b.y-a.y||0.1;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        const f=REPEL/(d*d);
        const fx=f*dx/d, fy=f*dy/d;
        if(!a.pinned){a.vx-=fx;a.vy-=fy;}
        if(!b.pinned){b.vx+=fx;b.vy+=fy;}
      }
    }
    // Spring
    mappedLinks.forEach(l=>{
      const a=pos[l.source],b=pos[l.target];
      if(!a||!b)return;
      const dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=SPRING*(d-REST);
      const fx=f*dx/d,fy=f*dy/d;
      if(!a.pinned){a.vx+=fx;a.vy+=fy;}
      if(!b.pinned){b.vx-=fx;b.vy-=fy;}
    });
    // Center pull
    graphNodes.forEach(n=>{
      if(n.id===centerNodeId)return;
      const p=pos[n.id];
      if(p.pinned)return;
      p.vx+=(W/2-p.x)*CPULL; p.vy+=(H/2-p.y)*CPULL;
    });
    // Integrate
    graphNodes.forEach(n=>{
      const p=pos[n.id];
      if(p.pinned)return;
      p.vx*=DAMP; p.vy*=DAMP;
      p.x+=p.vx; p.y+=p.vy;
      p.x=Math.max(30,Math.min(W-30,p.x));
      p.y=Math.max(30,Math.min(H-30,p.y));
    });
    updatePos();
  }

  function animate() {
    if(simRunning && frame++<MAX) { tick(); requestAnimationFrame(animate); }
  }
  animate();

  buildLegend(graphNodes);
}

function buildLegend(nodes) {
  const legend=document.getElementById('network-legend');
  legend.innerHTML='';
  [...new Set(nodes.map(n=>n.class))].forEach(cls=>{
    const item=document.createElement('div');
    item.className='legend-item';
    const dot=document.createElement('div');
    dot.className='legend-dot'; dot.style.background=CLASS_COLORS[cls]||'#999';
    const lbl=document.createElement('span');
    lbl.textContent=CLASS_LABELS[cls]||cls;
    item.appendChild(dot); item.appendChild(lbl); legend.appendChild(item);
  });
}

// ── Init ──
let networkInited=false;
function initNetwork() {
  buildTabs(); buildList();
  const hashNode=readHash();
  if(hashNode&&nodeById[hashNode]){
    activeNodeId=hashNode;
    currentClass=nodeById[hashNode].class;
    buildTabs(); buildList(); renderGraph(hashNode);
  }
}

const _origShowTab=window.showTab;
let miradorInited=false;
window.showTab=function(n){
  _origShowTab(n);
  if(n===2&&!networkInited){networkInited=true;loadNetworkData().then(()=>setTimeout(initNetwork,80));}
  else if(n===2){buildTabs();buildList();}
  if(n===3&&!miradorInited){miradorInited=true;initMirador();}
};

function initMirador(){
  Mirador.viewer({
    id: 'mirador-container',
    catalog: [
      { manifestId: 'https://eurasiamia.github.io/theatre1970/manifests/manifest_1155.json' },
      { manifestId: 'https://eurasiamia.github.io/theatre1970/manifests/manifest_0344.json' }
    ],
    windows: [
      { manifestId: 'https://eurasiamia.github.io/theatre1970/manifests/manifest_1155.json' },
      { manifestId: 'https://eurasiamia.github.io/theatre1970/manifests/manifest_0344.json' }
    ],
    config: {
      language: 'kr',
      selectedTheme: 'light',
      workspace: { type: 'mosaic', showZoomControls: true },
      workspaceControlPanel: { enabled: true },
      window: { defaultView: 'single', sideBarOpen: false }
    }
  });
}

window.addEventListener('load',()=>{
  if(new URLSearchParams(window.location.search).get('popup')==='1'){
    document.body.classList.add('popup-mode');
  }
  const h=readHash();
  if(h&&nodeById[h]){showTab(2);}
});
